<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registered Hospitals - eDonor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #d62828;
      margin-bottom: 30px;
    }

    .hospital-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .hospital-card {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }

    .hospital-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .hospital-card h3 {
      color: #b30000;
      margin-bottom: 10px;
    }

    .hospital-card p {
      margin: 6px 0;
      font-size: 14px;
      color: #333;
    }

    .hospital-card strong {
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Registered Hospitals</h1>

  <div class="hospital-container" id="hospitalList"></div>

  <script>
    async function loadHospitals() {
      try {
        const res = await fetch('http://e-donor-1.onrender.com/api/hospitals');
        const hospitals = await res.json();
        const container = document.getElementById('hospitalList');
        container.innerHTML = '';

        hospitals.forEach(h => {
          const card = document.createElement('div');
          card.className = 'hospital-card';

          card.innerHTML = `
            <img src="${h.image || 'placeholder.jpg'}" alt="${h.hospitalName}" />
            <h3>${h.hospitalName}</h3>
            <p><strong>City:</strong> ${h.hospitalCity}</p>
            <p><strong>Phone:</strong> ${h.hospitalPhone}</p>
            <p><strong>Email:</strong> ${h.hospitalEmail}</p>
            ${h.license ? `<p><strong>License:</strong> ${h.license}</p>` : ''}
            ${h.availableOrgans ? `<p><strong>Organs:</strong> ${h.availableOrgans}</p>` : ''}
          `;

          container.appendChild(card);
        });
      } catch (err) {
        console.error('Failed to fetch hospitals:', err);
        document.getElementById('hospitalList').innerHTML = '<p>Error loading hospital data.</p>';
      }
    }

    loadHospitals();
  </script>

</body>
</html>
