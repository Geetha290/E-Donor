<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Request Donation - eDonor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Request for Blood / Organ</h1>
  </header>

  <main class="form-container">
    <form id="requestForm">
      <div class="form-group">
        <label for="reqName">Full Name:</label>
        <input type="text" id="reqName" required />
      </div>

      <div class="form-group">
        <label for="type">Request Type:</label>
        <select id="type" required>
          <option value="">--Select--</option>
          <option value="Blood">Blood</option>
          <option value="Kidney">Kidney</option>
          <option value="Liver">Liver</option>
          <option value="Heart">Heart</option>
        </select>
      </div>

      <div class="form-group">
        <label for="bloodGroup">Blood Group (if applicable):</label>
        <select id="bloodGroup">
          <option value="">--Select--</option>
          <option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option>
          <option>O+</option><option>O-</option>
          <option>AB+</option><option>AB-</option>
        </select>
      </div>

      <div class="form-group">
        <label for="urgency">Urgency Level:</label>
        <select id="urgency" required>
          <option value="">--Select--</option>
          <option>Emergency</option>
          <option>Within 24 hours</option>
          <option>Flexible</option>
        </select>
      </div>

      <div class="form-group">
        <label for="contact">Contact Number:</label>
        <input type="tel" id="contact" required pattern="[0-9]{10}" />
      </div>

      <div class="form-group">
        <label for="notes">Additional Notes:</label>
        <textarea id="notes" rows="4"></textarea>
      </div>

      <button type="submit" class="btn">Submit Request</button>
    </form>
  </main>

  <footer>
    <p>© 2025 eDonor | Together, we care.</p>
  </footer>

  <script>
   
  document.getElementById("requestForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const name = document.getElementById("reqName").value.trim();
    const organ = document.getElementById("type").value;
    const bloodGroup = document.getElementById("bloodGroup").value || "N/A";
    const phone = document.getElementById("contact").value.trim();

    if (!name || !organ || !phone) {
      alert("Please fill in all required fields.");
      return;
    }

    fetch("http://localhost:3000/api/request-notify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, organ, bloodGroup, phone }),
    })
      .then((res) => res.json())
      .then((data) => {
        alert(data.message);
        document.getElementById("requestForm").reset();
      })
      .catch((err) => {
        console.error("Error:", err);
        alert("Something went wrong. Please try again later.");
      });
  });

 
  </script>
</body>
</html>
